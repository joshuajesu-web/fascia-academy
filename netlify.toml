[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

# Serve every page from Netlify's edge cache. Netlify purges it on each deploy,
# so new content still goes live immediately; browsers still revalidate.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000, stale-while-revalidate=31536000"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
